seed: 42              # Seed Python/NumPy/Torch/Open3D RNGs without forcing slower deterministic kernels.

pipeline:
  slam:
    buffer: 1024                         # Max number of keyframes kept in the SLAM graph buffer.
    beta: 0.3                            # Translation/rotation blend for graph proximity scoring.
    filter_thresh: 2.4                   # Dense motion threshold for deciding whether to add a keyframe.
    warmup: 8                            # Keyframes collected before initializing the frontend graph.
    keyframe_thresh: 4.0                 # Frontend threshold for pruning redundant keyframes.
    frontend_thresh: 16.0                # Proximity threshold for frontend graph edge creation.
    frontend_window: 25                  # Number of recent keyframes considered by frontend optimization.
    frontend_radius: 2                   # Local radius for forced frontend graph edges.
    frontend_nms: 1                      # Non-max suppression radius for frontend proximity edges.
    frontend_max_factors: 48             # Max active factors kept in the incremental frontend graph.
    frontend_max_age: 25                 # Delete active frontend factors after this many graph updates.
    frontend_init_updates: 8             # Graph update calls during frontend warmup initialization.
    frontend_update_iters1: 4            # First graph update loop after adding a new frontend keyframe.
    frontend_update_iters2: 2            # Extra graph update loop when the candidate keyframe is retained.
    frontend_ba_iters: 3                 # Inner BA solver iterations per frontend graph update.
    backend_thresh: 22.0                 # Proximity threshold for global backend graph edges.
    backend_radius: 2                    # Local radius for forced backend graph edges.
    backend_nms: 3                       # Non-max suppression radius for backend proximity edges.
    backend_iters: 31                    # Global backend BA iteration steps.
    backend_ba_iters: 8                  # Inner BA solver iterations per backend graph update.
    backend_max_factors_per_keyframe: 16 # Backend factor budget multiplier: max factors = value * keyframes.
    backend_batch_size: 8                # Keyframe-index batch size for backend DROID update/correlation.
    sparse_tracks: cuvslam               # "cuvslam" adds cuVSLAM sparse point tracks as an extra BA flow term; "none" disables it.
    sparse_tracks_fps: 30.0              # Timestamp rate supplied to cuVSLAM when canonical frames have no real timestamps.
    init_disp: 1.0                       # Initial disparity value before external sensor-depth anchors are injected.
    infill_chunk_size: 16                # Chunk size for filling non-keyframe poses between keyframes.
    ba:
      dense_disp_alpha: 0.001            # Weight for external sensor-depth regularization in BA.
      sparse_tracks_weight: 0.001        # Weight for sparse-track flow residuals in BA, matching the dense DROID flow scale.
      pose_smoothness_alpha: 0.02        # Weak adjacent-pose velocity prior in BA; prevents single-step jumps in ambiguous views.

  output:
    pcd_max_points: 10000000             # Max saved TSDF PCD points.
    pcd_tsdf_voxel_edge_m: 0.02          # TSDF voxel edge length in meters.
    pcd_tsdf_sdf_trunc_m: 0.15           # TSDF signed-distance truncation distance in meters.
    pcd_tsdf_depth_trunc_m: 5.0          # Ignore TSDF depth samples beyond this distance in meters.
    pcd_tsdf_num_voxels_per_block_edge: 16 # Number of voxels along each sparse TSDF block edge.
    pcd_tsdf_depth_sampling_stride: 4     # Sample every Nth depth pixel when opening TSDF voxel blocks.
